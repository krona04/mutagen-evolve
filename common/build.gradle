architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
}

// Standalone geometric regression check; does not launch a Minecraft client.
tasks.register('verifySpiderMorph', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'SpiderGeometryCheck'
}

tasks.register('verifyGameplay', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'GameplayBalanceCheck'
    workingDir = rootProject.projectDir
}

tasks.register('verifyCreatureMotion', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'MotionAndCollisionCheck'
}
