pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'mutagen'

include 'common'
// A single-loader build must not configure the other loader's Minecraft cache.
providers.gradleProperty('enabled_platforms').getOrElse('fabric,neoforge').split(',').each { platform ->
    include platform.trim()
}
